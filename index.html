<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Build, customize, preview, and print conversation card decks."
    />

    <meta name="referrer" content="no-referrer" />

    <title>Discussion Forge</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Conversation Deck Generator</p>

        <h1>Discussion Forge</h1>

      </div>
    </header>

    <main>
      <noscript>
        <p class="noscript-message">
          Discussion Forge requires JavaScript to generate, preview, and print
          conversation decks.
        </p>
      </noscript>

      <section class="controls" aria-labelledby="builder-title">
        <div class="builder-heading-row">
          <h2 id="builder-title">Build Your Deck</h2>

          <div id="builder-selection-summary" class="builder-selection-summary" aria-live="polite">
            <div>
              <span class="builder-summary-label">Available cards</span>
              <strong id="available-card-count">0</strong>
            </div>

            <div>
              <span class="builder-summary-label">Selected editions</span>
              <strong id="selected-edition-count">0</strong>
            </div>

            <div>
              <span class="builder-summary-label">Selected categories</span>
              <strong id="selected-category-count">0</strong>
            </div>
          </div>
        </div>

        <div class="control-grid">
          <div class="builder-panel content-panel">

            <div class="stack">
              <label for="card-pack">Card pack</label>
              <select id="card-pack"></select>
            </div>

            <div class="content-option-grid">
              <fieldset>
                <legend>Editions</legend>

                <div
                  id="edition-options"
                  class="option-list scrollable-options"
                ></div>
              </fieldset>

              <fieldset>
                <legend>Categories</legend>

                <div
                  id="category-options"
                  class="option-list scrollable-options"
                ></div>
              </fieldset>
            </div>
          </div>

          <div class="builder-panel builder-settings-panel">

            <div class="stack">
              <label for="deck-size">Playable cards</label>

              <input
                id="deck-size"
                type="number"
                min="1"
                max="250"
                step="1"
                value="24"
                inputmode="numeric"
              />

              <label for="seed">Generation seed</label>

              <div class="seed-row">
                <input
                  id="seed"
                  type="text"
                  value="discussion-forge"
                  maxlength="128"
                  autocomplete="off"
                  autocapitalize="off"
                  spellcheck="false"
                />

                <button id="random-seed" type="button">Random</button>
              </div>

              <label for="output-mode">Preview mode</label>

              <select id="output-mode">
                <option value="cards">Poker cards</option>
                <option value="list">Quick list</option>
              </select>

              <label for="theme">Card theme</label>
              <select id="theme"></select>
            </div>
          </div>
        </div>

        <details class="advanced-settings">
          <summary>Advanced Deck Settings</summary>

          <div class="advanced-settings-content">
            <p>
              Additional deck filters will appear here when supported by the
              active card pack.
            </p>
          </div>
        </details>

        <div class="actions">
          <button id="generate" type="button" class="primary">
            Generate Deck
          </button>

          <button id="print" type="button">Print / Save PDF</button>

          <button id="download-manifest" type="button">
            Download Manifest
          </button>
        </div>

        <p id="status" class="status" aria-live="polite" aria-atomic="true"></p>
      </section>

      <section
        id="preview-output"
        class="output preview-output"
        aria-label="Generated deck preview"
      ></section>

      <!--
        This duplicate renderer exists only for printing.
        It is excluded from the accessibility tree during
        ordinary screen use.
      -->
      <section
        id="print-output"
        class="output print-output"
        aria-hidden="true"
      ></section>
    </main>

    <script src="js/app.js" type="module"></script>
  </body>
</html>
