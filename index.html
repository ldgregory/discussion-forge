<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Convoy Conversations Prototype</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Overlanding Atlas</p>
        <h1>Convoy Conversations</h1>
        <p>Build a printable conversation deck from editions and categories.</p>
      </div>
    </header>
    <main>
      <section class="controls" aria-labelledby="builder-title">
        <h2 id="builder-title">Build Your Deck</h2>
        <div class="control-grid">
          <fieldset>
            <legend>Editions</legend>
            <div id="edition-options" class="option-list"></div>
          </fieldset>
          <fieldset>
            <legend>Categories</legend>
            <div id="category-options" class="option-list"></div>
          </fieldset>
          <div class="stack">
            <label for="deck-size">Playable cards</label
            ><input id="deck-size" type="number" min="1" value="24" /><label
              for="seed"
              >Seed</label
            >
            <div class="seed-row">
              <input id="seed" type="text" value="convoy-demo" /><button
                id="random-seed"
                type="button"
              >
                Random
              </button>
            </div>
            <label for="output-mode">Preview mode</label
            ><select id="output-mode">
              <option value="cards">Poker cards</option>
              <option value="list">Quick list</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button id="generate" type="button" class="primary">
            Generate Deck</button
          ><button id="print" type="button">Print / Save PDF</button
          ><button id="download-manifest" type="button">
            Download Manifest
          </button>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
      </section>
      <section id="deck-summary" class="deck-summary" hidden></section>
      <section
        id="preview-output"
        class="output preview-output"
        aria-live="polite"
        ></section>

        <section
        id="print-output"
        class="output print-output"
        aria-hidden="true"
        ></section>
    </main>
    <script src="js/app.js" type="module"></script>
  </body>
</html>
