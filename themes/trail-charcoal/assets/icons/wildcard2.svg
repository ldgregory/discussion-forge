<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Wild Card</title>
  <desc id="desc">
    A trail marker sign with a centered question mark.
  </desc>

  <!-- Outer badge -->
  <circle
    cx="12"
    cy="12"
    r="10.5"
    fill="#FFFDF8"
    stroke="#173B63"
    stroke-width="1.5"
  />

  <!-- Sign post, connected directly to the sign -->
  <path
    d="M12 11.8v7.3"
    fill="none"
    stroke="#173B63"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Post base -->
  <path
    d="M9.4 19.3h5.2"
    fill="none"
    stroke="#173B63"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Centered directional trail sign -->
  <path
    d="M6.2 5.4
       H16.4
       L18.2 7.9
       L16.4 10.4
       H6.2
       Z"
    fill="#173B63"
    stroke="#173B63"
    stroke-width="1.4"
    stroke-linejoin="round"
  />

  <!-- Question mark body, reduced slightly for breathing room -->
  <path
    d="M10.3 7.1
       c.15-.85.85-1.4 1.8-1.4
       1.05 0 1.85.6 1.85 1.5
       0 .7-.45 1.15-1.1 1.5
       -.6.35-.9.75-.9 1.25"
    fill="none"
    stroke="#FFFDF8"
    stroke-width="1.25"
    stroke-linecap="round"
  />

  <!-- Red question mark dot, fully inside the sign -->
  <circle
    cx="12"
    cy="9.55"
    r=".48"
    fill="#C9483C"
  />
</svg>
